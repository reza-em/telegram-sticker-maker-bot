<circle cx="1120" cy="40" r="170" fill="#8a5cf6" fill-opacity="0.16"/><circle cx="980" cy="330" r="130" fill="#ee5b9a" fill-opacity="0.18"/>
<rect x="64" y="52" width="86" height="6" rx="3" fill="url(#ac)"/>
<text x="64" y="128" font-size="46" font-weight="800" fill="#ffffff">Sticker Maker Bot</text>
<text x="64" y="166" font-size="24" font-weight="600" fill="url(#ac)">Photos &amp; text → Telegram stickers</text>
<text x="64" y="202" font-size="16.5" fill="#9fb0c3">Auto-resize to sticker limits · correct Persian text shaping · pack management</text>
<g><rect x="64" y="226" rx="14" ry="14" width="128" height="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="128" y="245" font-size="14" fill="#e6edf3" text-anchor="middle">WebP 512×512</text></g><g><rect x="202" y="226" rx="14" ry="14" width="128" height="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="266" y="245" font-size="14" fill="#e6edf3" text-anchor="middle">Persian text</text></g><g><rect x="340" y="226" rx="14" ry="14" width="137" height="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="409" y="245" font-size="14" fill="#e6edf3" text-anchor="middle">Sticker packs</text></g><g><rect x="488" y="226" rx="14" ry="14" width="73" height="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="525" y="245" font-size="14" fill="#e6edf3" text-anchor="middle">Pillow</text></g><g><rect x="571" y="226" rx="14" ry="14" width="73" height="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="608" y="245" font-size="14" fill="#e6edf3" text-anchor="middle">Python</text></g>
<text x="64" y="292" font-size="15" fill="#6e7f91" font-family="Consolas, Menlo, monospace">$ python bot.py<tspan fill="#ee5b9a"> ▍<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
